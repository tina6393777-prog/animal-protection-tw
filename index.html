<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1959 動保知識庫</title>
<style>
:root{
  --bg:#F5F5F3;
  --text:#1A1A1A;
  --muted:#777;
  --border:#E0DED8;
  --card:#fff;
  --radius:10px;

  --taoyuan:#E8736C;   --taoyuan-light:#FFF5F5; --taoyuan-mid:#F5B8B5;
  --nantou:#4DBF82;    --nantou-light:#F0FBF5;  --nantou-mid:#99DFB8;
  --chiayi:#E8953A;    --chiayi-light:#FFF8F0;  --chiayi-mid:#F5CEAA;
  --changhua:#5B9FE8;  --changhua-light:#F0F6FF;--changhua-mid:#A8CCEF;

  --cc:#4DBF82;
  --cl:#F0FBF5;
  --cm:#99DFB8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* ══ 跑馬燈 ══ */
#mqSec{overflow:hidden}
.mq-row{display:flex;align-items:center;height:34px;border-bottom:1px solid rgba(255,255,255,.15)}
.mq-row:last-child{border-bottom:none}
.mq-lbl{flex-shrink:0;padding:0 14px;font-size:11px;font-weight:700;height:100%;display:flex;align-items:center;border-right:1px solid rgba(255,255,255,.2);white-space:nowrap;color:#fff;letter-spacing:.5px}
.mq-track{overflow:hidden;flex:1;height:100%;display:flex;align-items:center}
.mq-txt{white-space:nowrap;display:inline-block;animation:mqs 35s linear infinite;font-size:12px;padding-left:24px;color:rgba(255,255,255,.92);letter-spacing:.3px}
.mq-row:hover .mq-txt{animation-play-state:paused}
@keyframes mqs{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

/* ══ Banner（縣市色） ══ */
#topStick{position:sticky;top:0;z-index:200}
#banner{
  background:var(--cc);
  padding:20px 32px 24px;
  transition:background .3s;
}
.banner-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{width:42px;height:42px;background:rgba(255,255,255,.25);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.brand-text h1{font-size:20px;font-weight:900;color:#fff;letter-spacing:.5px}
.brand-text p{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px;letter-spacing:.3px}
.banner-btns{display:flex;gap:7px;align-items:center;flex-shrink:0}
.wbtn{padding:7px 15px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:all .18s;letter-spacing:.3px}
.wbtn-solid{background:#fff;color:var(--cc);transition:background .3s,color .3s}
.wbtn-solid:hover{background:rgba(255,255,255,.85)}
.wbtn-ghost{background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.wbtn-ghost:hover{background:rgba(255,255,255,.32)}
.wbtn-ghost.on{background:rgba(255,255,255,.35);border-color:#fff}
.sz-btns{display:flex;gap:2px}
.sz-btn{background:rgba(255,255,255,.18);border:none;padding:6px 9px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;color:#fff;transition:background .18s}
.sz-btn:hover{background:rgba(255,255,255,.32)}

/* 搜尋框 */
.srch-row{display:flex;align-items:center;gap:10px}
.srch{
  flex:1;max-width:560px;
  display:flex;align-items:center;gap:9px;
  background:#fff;border-radius:9px;
  padding:10px 16px;
  box-shadow:0 2px 12px rgba(0,0,0,.12);
}
.srch input{border:none;outline:none;font-size:14px;width:100%;color:var(--text);font-family:inherit}
.srch input::placeholder{color:#aaa}
.srch-icon{color:#bbb;font-size:15px;flex-shrink:0}

/* ══ 縣市 Tab 列 ══ */
#cityNav{
  background:#fff;
  border-bottom:2px solid var(--border);
  padding:0 32px;
  display:flex;gap:0;
  transition:border-color .3s;
}
.c-tab{
  padding:13px 20px;border:none;background:none;
  cursor:pointer;font-size:13px;font-weight:700;
  color:var(--muted);font-family:inherit;
  position:relative;transition:color .18s;
  display:flex;align-items:center;gap:8px;
  letter-spacing:.3px;white-space:nowrap;
}
.c-tab::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:3px;background:transparent;border-radius:3px 3px 0 0;transition:background .18s}
.c-tab:hover{color:var(--text)}
.c-tab.active{color:var(--cc)}
.c-tab.active::after{background:var(--cc)}
.c-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;transition:transform .18s}
.c-tab.active .c-dot{transform:scale(1.2)}

/* ══ 主內容（無側欄，全寬） ══ */
#mainArea{max-width:900px;margin:0 auto;padding:24px 24px 40px}

/* 主題分類 Chip（比照 MUJI 的分類按鈕列） */
#chipBar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{
  padding:7px 16px;border-radius:999px;
  border:1.5px solid var(--border);
  background:#fff;color:var(--text);
  font-size:12px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:all .18s;
  white-space:nowrap;letter-spacing:.2px;
}
.chip:hover{border-color:var(--cc);color:var(--cc)}
.chip.active{background:var(--cc);border-color:var(--cc);color:#fff}

/* 結果小標 */
.res-meta{font-size:12px;color:var(--muted);margin-bottom:14px;letter-spacing:.3px;border-bottom:1px solid var(--border);padding-bottom:10px}

/* 主題區塊 */
.topic{margin-bottom:12px;border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.06)}
.t-hdr{
  display:flex;align-items:center;gap:9px;
  padding:12px 18px;cursor:pointer;user-select:none;
  transition:opacity .18s;background:var(--cc);
}
.t-hdr:hover{opacity:.92}
.t-num{width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.22);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0}
.t-ttl{color:#fff;font-size:13px;font-weight:800;flex:1;letter-spacing:.3px}
.t-tools{align-items:center;gap:4px;flex-shrink:0;display:none}
.t-btn{background:rgba(255,255,255,.22);border:none;color:#fff;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.t-btn:hover{background:rgba(255,255,255,.4)}
.t-cnt{font-size:10px;font-weight:700;color:rgba(255,255,255,.8);background:rgba(0,0,0,.15);padding:2px 8px;border-radius:999px;flex-shrink:0}
.t-chev{color:rgba(255,255,255,.8);font-size:12px;transition:transform .2s;flex-shrink:0}
.t-chev.open{transform:rotate(180deg)}
.t-body{display:none;background:#fff;border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.t-body.open{display:block}

/* QA 卡片 */
.qa-card{border-top:1px solid var(--border)}
.qa-card:first-child{border-top:none}
.qa-q{display:flex;align-items:flex-start;gap:10px;padding:13px 18px;cursor:pointer;transition:background .13s;user-select:none}
.qa-q:hover{background:var(--cl)}
.q-badge{width:20px;height:20px;border-radius:5px;background:var(--cc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;flex-shrink:0;margin-top:2px;transition:background .3s}
.q-txt{font-size:13px;font-weight:700;flex:1;line-height:1.6;word-break:break-word}
.qa-acts{display:none;gap:3px;flex-shrink:0;align-items:center}
.mv-btn{background:rgba(0,0,0,.06);color:var(--muted);border:none;cursor:pointer;padding:2px 5px;border-radius:3px;font-size:10px;font-weight:700;line-height:1}
.mv-btn:hover:not([disabled]){background:rgba(0,0,0,.13)}
.mv-btn[disabled]{opacity:.25;cursor:default}
.q-chev{color:#ccc;font-size:10px;flex-shrink:0;margin-top:5px;transition:transform .2s}
.q-chev.open{transform:rotate(180deg)}
.qa-a{display:none;padding:0 18px 16px 48px;background:var(--cl);border-top:1px solid var(--border)}
.qa-a.open{display:block}
.a-txt{font-size:13px;line-height:1.9;white-space:pre-wrap;padding-top:13px;word-break:break-word}
.qa-edit-btns{display:none;gap:3px;flex-shrink:0;align-items:center}
.eb2,.db2,.qa-pb2{border:none;cursor:pointer;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;font-family:inherit}
.eb2{background:#E3F2FD;color:#1565C0}.eb2:hover{background:#BBDEFB}
.db2{background:#FFEBEE;color:#C62828}.db2:hover{background:#FFCDD2}
.qa-pb2{background:#FFF8E1;color:#795548}.qa-pb2:hover{background:#FFE082}

.hl-red{color:#D32F2F;font-weight:700}
.hl-orange{color:#E64A19;font-weight:700}
.hl-blue{color:#1565C0;font-weight:700}
.hl-green{color:#2E7D32;font-weight:700}
.hl-purple{color:#4527A0;font-weight:700}
.a-link{color:var(--cc);text-decoration:underline;word-break:break-all}
.a-link:hover{opacity:.75}
.url-chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid var(--border);border-radius:7px;padding:5px 12px;margin:8px 0 3px;font-size:12px;font-weight:600;text-decoration:none;color:var(--cc);transition:border-color .18s;word-break:break-all}
.url-chip:hover{border-color:var(--cc)}
.copy-btn{background:#fff;color:var(--cc);border:1.5px solid var(--cm);cursor:pointer;padding:4px 11px;border-radius:6px;font-size:11px;font-weight:700;margin-top:9px;font-family:inherit;transition:all .18s}
.copy-btn:hover{background:var(--cl)}
.img-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.img-wrap img{max-width:180px;border-radius:8px;cursor:pointer;border:2px solid var(--border)}
.img-wrap img:hover{border-color:var(--cc)}
.info-card{padding:12px 18px;font-size:13px;line-height:1.8;border-top:1px solid var(--border);background:#fff;white-space:pre-wrap;word-break:break-word}
.info-card:first-child{border-top:none}

/* 搜尋結果 */
#srchPanel{max-width:900px;margin:0 auto;padding:24px}
.srch-hdr{font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px;letter-spacing:.3px}
.hit{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:8px;cursor:pointer;transition:all .18s}
.hit:hover{border-color:var(--cc);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.hit-meta{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:11px;color:var(--muted)}
.hit-city{color:#fff;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700}
.hit-q{font-size:13px;font-weight:700;line-height:1.5}
.hit-a{font-size:12px;color:var(--muted);margin-top:3px;max-height:44px;overflow:hidden;white-space:pre-wrap}
mark{background:#FFF9C4;border-radius:2px;padding:0 2px}
.no-res{text-align:center;color:var(--muted);padding:48px 20px;font-size:13px}

/* AI 浮動 */
#aiBox{position:fixed;bottom:24px;right:24px;z-index:500;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#aiToggle{width:52px;height:52px;border-radius:50%;background:var(--cc);border:none;cursor:pointer;font-size:22px;box-shadow:0 4px 18px rgba(0,0,0,.18);transition:all .3s;display:flex;align-items:center;justify-content:center;color:#fff}
#aiToggle:hover{transform:scale(1.1)}
#aiPanel{width:340px;background:#fff;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.14);display:none;flex-direction:column;overflow:hidden;max-height:520px}
#aiPanel.open{display:flex}
#aiPHdr{background:var(--cc);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;transition:background .3s}
#aiPHdr span{font-size:13px;font-weight:800;letter-spacing:.3px}
#aiPHdr button{background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:18px;line-height:1;padding:0}
#hlSearch{padding:12px;border-bottom:1px solid var(--border);flex-shrink:0}
#hlInput{width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;outline:none;transition:border-color .2s}
#hlInput:focus{border-color:var(--cc)}
#hlQuick{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex-shrink:0}
.hlq-lbl{font-size:11px;font-weight:800;color:var(--muted)}
.hlq-btn{background:var(--cl);border:1px solid var(--cm);color:var(--cc);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;transition:filter .15s}
.hlq-btn:hover{filter:brightness(.97)}
.hl-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.hl-imgs img{max-width:100%;border-radius:6px;cursor:pointer;border:1px solid var(--border)}
#quickBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 0 2px}
.qbar-lbl{font-size:13px;font-weight:900;color:var(--cc)}
.qbar-btn{background:var(--cc);color:#fff;border:none;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:800;cursor:pointer;transition:filter .15s;box-shadow:0 2px 6px rgba(0,0,0,.10)}
.qbar-btn:hover{filter:brightness(.93)}
#hlNote{padding:6px 14px;font-size:11px;color:var(--muted);background:var(--cl);border-bottom:1px solid var(--border);flex-shrink:0}
#hlNote b{color:var(--cc)}
#hlResults{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px;min-height:180px}
.hl-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:32px 12px;line-height:1.8}
.hl-hit{border:1px solid var(--border);border-left:4px solid var(--cc);border-radius:9px;padding:9px 11px;background:#fff}
.hl-hit-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.hl-rank{width:18px;height:18px;border-radius:50%;background:var(--cc);color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hl-crumb{font-size:10.5px;color:var(--muted);font-weight:700}
.hl-rel{margin-left:auto;font-size:9.5px;font-weight:800;color:var(--cc);background:var(--cl);border-radius:999px;padding:1px 7px}
.hl-q{font-size:13px;font-weight:800;line-height:1.5;margin-bottom:3px}
.hl-a{font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.hl-cp{margin-top:7px;background:var(--cl);color:var(--cc);border:none;border-radius:6px;padding:5px 11px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit}
.hl-cp:hover{filter:brightness(.96)}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:1000;align-items:center;justify-content:center;padding:14px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:15px;font-weight:800;margin-bottom:16px;letter-spacing:.3px}
.modal-btns{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg textarea,.fg select{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;color:var(--text);outline:none;transition:border-color .18s;resize:vertical}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--cc)}
.fg textarea{min-height:90px}
.upload-zone{border:2px dashed var(--border);border-radius:9px;padding:14px;text-align:center;cursor:pointer;color:var(--muted);font-size:13px;transition:border-color .18s}
.upload-zone:hover{border-color:var(--cc)}
.img-prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.img-prev img{width:64px;height:48px;object-fit:cover;border-radius:5px;border:2px solid var(--border)}
.color-bar{display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap;padding:8px 10px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.color-bar span{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.clr-btn{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.6);cursor:pointer;transition:transform .15s;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.clr-btn:hover{transform:scale(1.3)}
.clr-clear{background:#fff;border:1px solid var(--border);border-radius:5px;padding:2px 8px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--muted)}
.clr-clear:hover{border-color:var(--cc);color:var(--cc)}
.a-prev{margin-top:8px;padding:10px;background:#fff;border-radius:8px;font-size:13px;line-height:1.8;white-space:pre-wrap;border:1px solid var(--border);display:none}
.a-prev-lbl{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px;display:block;text-transform:uppercase}
.mmbtn{padding:6px 13px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:all .18s;display:inline-flex;align-items:center;gap:5px}
.mm-solid{background:var(--cc);color:#fff;transition:background .3s}
.mm-solid:hover{opacity:.88}
.mm-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.mm-ghost:hover{border-color:var(--cc);color:var(--cc)}
.mm-danger{background:#FFEBEE;color:#C62828;border:none}
.mm-danger:hover{background:#FFCDD2}
.admin-sec{margin-bottom:18px}
.admin-sec h4{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
.mq-row2{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.mq-row2 select{width:85px;flex-shrink:0;padding:7px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;outline:none}
.mq-row2 input{flex:1;padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;outline:none}
.mq-del{background:#FFEBEE;color:#C62828;border:none;cursor:pointer;padding:7px 10px;border-radius:7px;font-weight:700;font-size:12px}
.exp-btns{display:flex;gap:7px;flex-wrap:wrap}
.info-box{background:var(--cl);border:1px solid var(--cm);border-radius:9px;padding:11px 13px;margin-bottom:10px;font-size:12px;line-height:1.7}
.login-box{background:#fff;border-radius:14px;padding:28px;width:280px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.login-box h3{font-size:15px;font-weight:800;margin-bottom:4px}
.login-box p{font-size:12px;color:var(--muted);margin-bottom:14px}
.login-box input{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:9px;font-size:18px;text-align:center;letter-spacing:5px;outline:none;margin-bottom:7px;font-family:inherit}
.login-box input:focus{border-color:var(--cc)}
.l-err{color:#C62828;font-size:12px;margin-bottom:6px;display:none}
.l-btns{display:flex;gap:6px}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:2000;align-items:center;justify-content:center}
.lb.open{display:flex}
.lb img{max-width:90vw;max-height:90vh;border-radius:8px}
.lb-x{position:fixed;top:16px;right:20px;color:#fff;font-size:30px;cursor:pointer;line-height:1;font-weight:300;opacity:.8}
.toast{position:fixed;bottom:20px;right:20px;background:#1A1A1A;color:#fff;padding:10px 16px;border-radius:9px;font-size:12px;font-weight:600;z-index:3000;transform:translateY(80px);opacity:0;transition:all .28s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
@media(max-width:680px){
  #banner{padding:14px 16px 18px}
  .brand-text h1{font-size:16px}
  .srch{max-width:100%}
  #cityNav{padding:0 12px;overflow-x:auto}
  .c-tab{padding:11px 12px;font-size:12px}
  #mainArea{padding:14px 12px 32px}
  #aiPanel{width:calc(100vw - 28px)}
  .banner-btns .sz-btns{display:none}
}
</style>
</head>
<body>

<!-- 跑馬燈 -->
<div id="mqSec"></div>

<!-- 固定區：橫幅＋搜尋＋縣市分頁 -->
<div id="topStick">
<div id="banner">

<script>
var COLORS={'桃園':'#E8736C','南投':'#4DBF82','嘉義':'#E8953A','彰化':'#5B9FE8'};
var COLORS_LIGHT={'桃園':'#FFF5F5','南投':'#F0FBF5','嘉義':'#FFF8F0','彰化':'#F0F6FF'};
var COLORS_MID={'桃園':'#F5B8B5','南投':'#99DFB8','嘉義':'#F5CEAA','彰化':'#A8CCEF'};
var CITIES=['桃園','南投','嘉義','彰化'];
var db,city='桃園',adminMode=false,pImgs=[],editCtx=null,mqData=[],fSize=14,aiOpen=false,curChip=-1;

function E(id){return document.getElementById(id);}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rc(s){if(!s)return'';return esc(s).replace(/\[\[(\w+):([^\]]*)\]\]/g,function(_,c,t){return'<span class="hl-'+c+'">'+t+'</span>';});}
function sc(s){return(s||'').replace(/\[\[\w+:([^\]]*)\]\]/g,'$1');}
function lfy(s){return s.replace(/(https?:\/\/)([^\s<>"&]*)(&amp;[^\s<>"]*)?/g,function(_,a,b,c){var u=(a+b+(c||'')).replace(/&amp;/g,'&');return'<a class="a-link" href="'+u+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+(a+b+(c||''))+'</a>';});}
function hl(t,q){return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}
function toast(m){var t=E('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2500);}
function saveDB(){try{localStorage.setItem('qadb',JSON.stringify(db));}catch(e){}}

function setTheme(c){
  var r=document.documentElement.style;
  r.setProperty('--cc',COLORS[c]);
  r.setProperty('--cl',COLORS_LIGHT[c]);
  r.setProperty('--cm',COLORS_MID[c]);
  // 更新 wbtn-solid 的文字色
  document.querySelectorAll('.wbtn-solid').forEach(function(el){el.style.color=COLORS[c];});
}

function init(){
  fSize=parseInt(localStorage.getItem('fs')||'14');
  document.body.style.fontSize=fSize+'px';
  try{mqData=JSON.parse(localStorage.getItem('mq')||'[]');}catch(e){mqData=[];}
  if(!mqData.length)mqData=[{scope:'all',text:'歡迎使用 1959 動保知識庫！提供桃園、南投、嘉義、彰化四縣市動物保護資訊查詢。'}];
  setTheme(city);
  renderMQ();renderTabs();
  E('content').innerHTML='<div style="padding:48px;text-align:center;color:var(--muted)">⏳ 載入資料中…</div>';
  fetch('data.json?t='+Date.now())
    .then(function(r){if(!r.ok)throw new Error('無法載入 data.json ('+r.status+')');return r.json();})
    .then(function(j){if(!j['桃園'])throw new Error('data.json 格式不符');db=j;saveDB();renderChips();renderContent();})
    .catch(function(err){
      var s=localStorage.getItem('qadb');
      if(s){try{db=JSON.parse(s);renderChips();renderContent();toast('⚠ 使用暫存資料');return;}catch(e2){}}
      E('content').innerHTML='<div style="padding:48px;text-align:center"><div style="font-size:36px;margin-bottom:12px">⚠️</div><div style="font-size:15px;font-weight:700;color:#C62828;margin-bottom:8px">無法載入資料</div><div style="font-size:12px;color:var(--muted)">'+esc(err.message)+'</div></div>';
    });
}

function chgSz(d){fSize=Math.max(12,Math.min(20,fSize+d));localStorage.setItem('fs',fSize);document.body.style.fontSize=fSize+'px';}

// ── 跑馬燈 ──
function renderMQ(){
  var el=E('mqSec');
  var rows=mqData.filter(function(m){return m.text.trim();});
  if(!rows.length){el.style.display='none';return;}
  el.style.display='block';
  el.innerHTML=rows.map(function(m){
    var bg=m.scope==='all'?'#444':(COLORS[m.scope]||'#555');
    var lbl=m.scope==='all'?'📢 全站':('📌 '+m.scope);
    var rowBg=m.scope==='all'?'#333':(COLORS[m.scope]||'#444');
    return '<div class="mq-row" style="background:'+rowBg+'">'
      +'<span class="mq-lbl" style="background:'+bg+'">'+lbl+'</span>'
      +'<div class="mq-track"><div class="mq-txt">'+esc(m.text)+'</div></div></div>';
  }).join('');
}

// ── 縣市 Tabs ──
function renderTabs(){
  E('cityNav').innerHTML=CITIES.map(function(c){
    return '<button class="c-tab'+(c===city?' active':'')+'" onclick="switchCity(\''+c+'\')">'
      +'<span class="c-dot" style="background:'+COLORS[c]+'"></span>'+c+'</button>';
  }).join('');
}
function switchCity(c){
  city=c;curChip=-1;
  setTheme(c);
  E('srchInput').value='';
  E('srchPanel').style.display='none';
  E('mainArea').style.display='block';
  renderTabs();renderChips();renderContent();
  if(aiOpen)runHL();
}

// ── Chip 分類 ──
function renderChips(){
  if(!db||!db[city]){E('chipBar').innerHTML='';return;}
  var topics=db[city].topics;
  E('chipBar').innerHTML=topics.map(function(t,i){
    return '<button class="chip'+(curChip===i?' active':'')+'" onclick="clickChip('+i+')">'+esc(t.name)+'</button>';
  }).join('');
  updateMeta();
}
function clickChip(i){
  curChip=(curChip===i?-1:i);
  renderChips();renderContent();
}
function updateMeta(){
  if(!db||!db[city]){E('resMeta').textContent='';return;}
  var topics=db[city].topics;
  if(curChip>=0&&curChip<topics.length){
    E('resMeta').textContent=topics[curChip].name+' · 共 '+topics[curChip].items.length+' 筆';
  }else{
    var total=topics.reduce(function(s,t){return s+t.items.length;},0);
    E('resMeta').textContent=city+' · '+topics.length+' 個主題 · '+total+' 筆資料';
  }
}

// ── 主內容 ──
function renderContent(){
  if(!db||!db[city]){return;}
  var topics=db[city].topics;
  updateMeta();
  // 決定要顯示哪些主題
  var showTopics=curChip>=0?[{t:topics[curChip],i:curChip}]:topics.map(function(t,i){return{t:t,i:i};});
  var h='';
  if(adminMode){
    h+='<div style="margin-bottom:14px"><button class="mmbtn mm-solid" style="font-size:11px;padding:5px 11px" onclick="openAddQa(0)">＋ 新增 Q&A</button></div>';
  }
  showTopics.forEach(function(obj){
    var topic=obj.t,ti=obj.i,last=topic.items.length-1;
    h+='<div class="topic" id="topic'+ti+'">'
      +'<div class="t-hdr" onclick="togTopic('+ti+')">'
      +'<div class="t-num">'+(ti+1)+'</div>'
      +'<div class="t-ttl">'+esc(topic.name)+'</div>'
      +'<div class="t-tools" style="display:'+(adminMode?'flex':'none')+'">'
      +'<button class="t-btn" onclick="event.stopPropagation();openAddQa('+ti+')">＋ 新增</button>'
      +'<button class="t-btn" onclick="event.stopPropagation();sortT('+ti+',1)">A↑Z</button>'
      +'<button class="t-btn" onclick="event.stopPropagation();sortT('+ti+',-1)">Z↓A</button></div>'
      +'<span class="t-cnt">'+topic.items.length+'</span>'
      +'<span class="t-chev open" id="tchev'+ti+'">▾</span></div>'
      +'<div class="t-body open" id="tbody'+ti+'">';
    topic.items.forEach(function(item,ii){
      var hasDet=item.a||item.url||(item.imgs&&item.imgs.length);
      if(hasDet){
        var aH=item.a?lfy(rc(item.a)):'';
        var uH=item.url?'<a class="url-chip a-link" href="'+esc(item.url)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 '+esc(item.url)+'</a>':'';
        var iH=(item.imgs&&item.imgs.length)?'<div class="img-wrap">'+item.imgs.map(function(s,si){return'<img src="'+s+'" onclick="openLb('+ti+','+ii+','+si+')" alt="附圖">';}).join('')+'</div>':'';
        var cB=item.a?'<button class="copy-btn" onclick="event.stopPropagation();cpTxt('+ti+','+ii+')">📋 複製回答</button>':'';
        var adm=adminMode?'<div class="qa-acts" style="display:flex">'
          +'<button class="mv-btn" onclick="event.stopPropagation();moveQa('+ti+','+ii+',-1)" '+(ii===0?'disabled':'')+'>▲</button>'
          +'<button class="mv-btn" onclick="event.stopPropagation();moveQa('+ti+','+ii+',1)" '+(ii===last?'disabled':'')+'>▼</button>'
          +'<button class="eb2" onclick="event.stopPropagation();openEdit('+ti+','+ii+')">✏</button>'
          +'<button class="db2" onclick="event.stopPropagation();delQa('+ti+','+ii+')">🗑</button></div>':'';
        h+='<div class="qa-card"><div class="qa-q" onclick="togQA('+ti+','+ii+')">'
          +'<div class="q-badge">Q</div><div class="q-txt">'+lfy(rc(item.q))+'</div>'
          +adm+'<span class="q-chev" id="chev'+ti+'_'+ii+'">▾</span></div>'
          +'<div class="qa-a" id="qaa'+ti+'_'+ii+'">'+(aH?'<div class="a-txt">'+aH+'</div>':'')+cB+uH+iH+'</div></div>';
      }else{
        var adm2=adminMode?'<span style="float:right;display:inline-flex;gap:3px;margin-left:7px">'
          +'<button class="eb2" style="font-size:10px;padding:2px 6px" onclick="event.stopPropagation();openEdit('+ti+','+ii+')">✏</button>'
          +'<button class="db2" style="font-size:10px;padding:2px 6px" onclick="event.stopPropagation();delQa('+ti+','+ii+')">🗑</button></span>':'';
        h+='<div class="info-card">'+adm2+lfy(rc(item.q))+'</div>';
      }
    });
    h+='</div></div>';
  });
  E('content').innerHTML=h||'<div style="padding:32px;text-align:center;color:var(--muted)">此主題尚無資料</div>';
}

function sortT(ti,dir){db[city].topics[ti].items.sort(function(a,b){return dir*(a.q||'').localeCompare(b.q||'','zh-TW');});saveDB();renderContent();toast(dir>0?'✅ A→Z':'✅ Z→A');}
function togTopic(i){E('tbody'+i).classList.toggle('open');E('tchev'+i).classList.toggle('open');}
function mainFixed(key){
  var test=HL_FIXED[key];if(!test||!db||!db[city]){return;}
  var topics=db[city].topics;
  for(var ti=0;ti<topics.length;ti++){for(var ii=0;ii<topics[ti].items.length;ii++){if(test(topics[ti].items[ii])){gotoRes(city,ti,ii);return;}}}
  toast('目前縣市找不到這筆常用資料');
}
function togQA(ti,ii){var a=E('qaa'+ti+'_'+ii);var c=E('chev'+ti+'_'+ii);a.classList.toggle('open');c.classList.toggle('open');}
function cpTxt(ti,ii){var t=sc(db[city].topics[ti].items[ii].a||'');if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){toast('📋 已複製');});}else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('📋 已複製');}}
function openLb(ti,ii,si){E('lbImg').src=db[city].topics[ti].items[ii].imgs[si];E('lb').classList.add('open');}
function closeLb(){E('lb').classList.remove('open');}
function moveQa(ti,ii,dir){var items=db[city].topics[ti].items;var dest=ii+dir;if(dest<0||dest>=items.length)return;var tmp=items[ii];items[ii]=items[dest];items[dest]=tmp;saveDB();renderContent();toast(dir<0?'▲ 上移':'▼ 下移');}

// ── 搜尋 ──
function doSearch(q){
  q=q.trim();
  if(!q){E('srchPanel').style.display='none';E('mainArea').style.display='block';return;}
  E('mainArea').style.display='none';E('srchPanel').style.display='block';
  var ql=q.toLowerCase(),hits=[];
  CITIES.forEach(function(c){db[c].topics.forEach(function(t,ti){t.items.forEach(function(item,ii){
    var qp=sc(item.q),ap=sc(item.a||'');
    if(qp.toLowerCase().indexOf(ql)>=0||ap.toLowerCase().indexOf(ql)>=0||(item.url&&item.url.toLowerCase().indexOf(ql)>=0))
      hits.push({c:c,t:t.name,ti:ti,ii:ii,item:item,qp:qp,ap:ap});
  });});});
  if(!hits.length){E('srchPanel').innerHTML='<div class="no-res">🔍 未找到「'+esc(q)+'」<br><span style="font-size:12px;display:block;margin-top:6px">建議換個關鍵字，或直接瀏覽各縣市主題</span></div>';return;}
  var h='<div class="srch-hdr">搜尋「'+esc(q)+'」，共 '+hits.length+' 筆結果</div>';
  hits.forEach(function(hit){
    var col=COLORS[hit.c];

      +'<div class="hit-meta"><span class="hit-city" style="background:'+col+'">'+hit.c+'</span>› '+esc(hit.t)+'</div>'
      +'<div class="hit-q">'+hl(esc(hit.qp),q)+'</div>'
      +(hit.ap?'<div class="hit-a">'+hl(esc(hit.ap.substring(0,130)),q)+(hit.ap.length>130?'…':'')+'</div>':'')+'</div>';
  });
  E('srchPanel').innerHTML=h;
}

// ── 話術快找（本地聰明媒合，不用 AI 金鑰，不外連）──
var HL_SYN=[
 ["狗","犬","浪犬","流浪狗","流浪犬","土狗","毛小孩","狗狗","犬隻"],
 ["貓","喵","浪貓","流浪貓","幼貓","奶貓","貓咪","貓隻"],
 ["撿到","拾獲","撿","發現","看到","遇到"],
 ["屍體","大體","遺體","往生","死亡","死掉","過世","路殺"],
 ["受傷","受困","卡住","掉入","掉到","困住","脫困","夾到","被夾"],
 ["誘捕籠","捕籠","籠子","借籠","捕捉籠"],
 ["晶片","寵物登記","寵登","植晶片","登記"],
 ["認養","領養","送養","認領養"],
 ["棄養","不想養","不養","丟棄","不擬飼養","不要了"],
 ["咬人","攻擊","兇","追人","追咬","攻擊性","危險"],
 ["通報","陳情","檢舉","投訴","申訴","反映","舉報"],
 ["絕育","結紮","節育","tnvr"],
 ["狂犬病","疫苗","預防注射","打針","注射"],
 ["收容所","動物之家","園區","收容處所","教育園區"],
 ["八哥","雛鳥","鳥","野鳥","鳥類","幼鳥"],
 ["蛇","蜂","野生動物","保育類","保育動物"],
 ["噪音","吵","很吵","叫聲","擾民"],
 ["髒亂","環境差","衛生","惡臭","臭"],
 ["捕犬","抓狗","抓犬","捕捉"],
 ["送醫","看醫生","動物醫院","獸醫","急診"],
 ["補助","申請補助","經費"],
 ["路上","路邊","馬路","街上","路口"],
 ["水溝","排水溝","大排","溝裡"],
 ["引擎蓋","車底","車子裡"],
 ["高速公路","國道","快速道路","交流道"]
];
function hlNrm(s){return String(s||'').replace(/\[\[\w+:([^\]]*)\]\]/g,'$1').replace(/[\s　,，。、？?！!：:（）()「」『』…\.\-~〜/#]/g,'').toLowerCase();}
var HL_G=HL_SYN.map(function(g){return g.map(hlNrm);});
function hlTerms(q){
  var nq=hlNrm(q),terms=[];
  HL_G.forEach(function(g){for(var i=0;i<g.length;i++){if(g[i]&&nq.indexOf(g[i])>=0){terms.push({g:g,w:3});break;}}});
  var seen={};
  for(var n=2;n<=3;n++){for(var i=0;i+n<=nq.length;i++){var gm=nq.substr(i,n);if(!seen[gm]){seen[gm]=1;terms.push({g:[gm],w:1});}}}
  return terms;
}
function hlScore(item,terms){
  var q=hlNrm(item.q),a=hlNrm(item.a||''),s=0,hitQ=0,used={};
  terms.forEach(function(t){
    var key=t.g.join('|');if(used[key])return;
    var inQ=t.g.some(function(w){return w&&q.indexOf(w)>=0;});
    var inA=t.g.some(function(w){return w&&a.indexOf(w)>=0;});
    if(inQ){s+=t.w*3;hitQ++;used[key]=1;}
    else if(inA){s+=t.w*1;used[key]=1;}
  });
  if(hitQ>=2)s+=hitQ*1.5;
  return s;
}
var hlWin=[];
function toggleAI(){aiOpen=!aiOpen;if(aiOpen){E('aiPanel').classList.add('open');E('hlCity').textContent=city;runHL();setTimeout(function(){E('hlInput').focus();},100);}else{E('aiPanel').classList.remove('open');}}
function runHL(){
  var q=(E('hlInput').value||'').trim();var box=E('hlResults');E('hlCity').textContent=city;
  if(!q){box.innerHTML='<div class="hl-empty">輸入民眾的問題，<br>自動幫你找出對應的話術與流程 🐾</div>';hlWin=[];return;}
  if(!db||!db[city]){box.innerHTML='<div class="hl-empty">資料載入中…</div>';return;}
  var terms=hlTerms(q),hits=[];
  db[city].topics.forEach(function(tp){tp.items.forEach(function(item){var sf=hlScore(item,terms);if(sf>0)hits.push({it:item,t:tp.name,s:sf});});});
  hits.sort(function(a,b){return b.s-a.s;});hits=hits.slice(0,5);hlWin=hits.map(function(h){return h.it;});
  if(!hits.length){box.innerHTML='<div class="hl-empty">找不到「'+esc(q)+'」的相關話術<br>換個講法，或到下方主題瀏覽</div>';return;}
  var max=hits[0].s,h='';
  hits.forEach(function(hit,i){
    var it=hit.it,rel=Math.round(hit.s/max*100);
    var body=it.a?lfy(rc(it.a)):((it.imgs&&it.imgs.length)?'（此題含流程圖，請至下方主題查看圖片）':'');
    h+='<div class="hl-hit"><div class="hl-hit-top"><span class="hl-rank">'+(i+1)+'</span>'
      +'<span class="hl-crumb">'+esc(hit.t)+'</span><span class="hl-rel">相關度 '+rel+'%</span></div>'
      +'<div class="hl-q">'+rc(it.q)+'</div>'
      +(body?'<div class="hl-a">'+body+'</div>':'')
      +(it.a?'<button class="hl-cp" onclick="hlCopy('+i+')">📋 複製話術</button>':'')
      +'</div>';
  });
  box.innerHTML=h;
}
function hlCopy(i){var it=hlWin[i];if(!it)return;var txt=sc(it.a||'');if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast('📋 已複製話術');});}else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('📋 已複製話術');}}
var HL_FIXED={
  addr:function(it){return ((it.a||'').indexOf('TPCToMap')>=0)||((it.q||'').indexOf('報座標')>=0);},
  body:function(it){return (it.q||'').indexOf('通報路上')>=0;},
  kitten:function(it){return (it.q||'').indexOf('拾獲身上乾淨')>=0;},
  bird:function(it){return (it.q||'').indexOf('拾獲學飛')>=0;}
};
function hlFixed(key){
  E('hlInput').value='';var box=E('hlResults');E('hlCity').textContent=city;
  var test=HL_FIXED[key];if(!test)return;
  var found=null,ft='';
  if(db&&db[city]){db[city].topics.forEach(function(tp){tp.items.forEach(function(item){if(!found&&test(item)){found=item;ft=tp.name;}});});}
  if(!found){box.innerHTML='<div class="hl-empty">目前縣市（'+city+'）沒有這筆常用資料</div>';hlWin=[];return;}
  hlWin=[found];
  var body=found.a?lfy(rc(found.a)):'';
  var imgs=(found.imgs&&found.imgs.length)?'<div class="hl-imgs">'+found.imgs.map(function(s){return '<img src="'+s+'" onclick="E(\'lbImg\').src=this.src;E(\'lb\').classList.add(\'open\')" alt="附圖">';}).join('')+'</div>':'';
  box.innerHTML='<div class="hl-hit"><div class="hl-hit-top"><span class="hl-rank">📌</span><span class="hl-crumb">'+esc(ft)+' · 常用</span></div><div class="hl-q">'+rc(found.q)+'</div>'+(body?'<div class="hl-a">'+body+'</div>':'')+imgs+'<button class="hl-cp" onclick="hlCopy(0)">📋 複製話術</button></div>';
}
